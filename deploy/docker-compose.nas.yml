# Legal Dashboard — deploy pe NAS Synology, in spatele unui Cloudflare Tunnel.
#
# Layout:
#   internet → Cloudflare (TLS, WAF, DDoS) → cloudflared (container separat)
#     → oauth2-proxy (4180, publicat pe host) → backend (3002, expose only)
#
# Diferente fata de deploy/docker-compose.prod.yml:
#   - fara Caddy: TLS-ul e terminat de Cloudflare, iar tunelul e outbound-only,
#     deci nu se deschid porturile 80/443 in router si nu exista Let's Encrypt;
#   - oauth2-proxy publica portul 4180 pe host, pentru ca tunelul ruleaza in alt
#     proiect Container Manager (alta retea Docker) si il atinge prin IP-ul LAN;
#   - baza SQLite sta pe bind mount ./data, ca sa intre in Hyper Backup.
#
# ATENTIE: acest fisier se COPIAZA in radacina proiectului, redenumit
# docker-compose.yml (`context: .` presupune ca sta langa Dockerfile). Rulat
# din deploy/, contextul de build ar fi gresit.
#
# Start (Container Manager: Project → Create, path = radacina proiectului,
# source = Use existing docker-compose.yml) sau din CLI:
#   docker compose --env-file .env up -d
services:
  oauth2-proxy:
    # v2.45.0: bump de la v7.7.1. Sub 7.15.2 se aduna sapte advisories, trei
    # critice, iar trei dintre ele cad exact pe suprafata folosita aici
    # (skip_auth_routes + reverse_proxy): CVE-2026-40575 (X-Forwarded-Uri
    # spoofat), CVE-2025-54576 si CVE-2026-41059 (bypass de skip_auth_routes).
    # Singurul breaking change relevant intre 7.7 si 7.15 e cel din v7.11.0 —
    # skip_auth_routes se evalueaza doar pe path, fara query string — iar
    # rutele de mai jos sunt ancorate pe path, deci comportamentul nu se schimba.
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3-alpine@sha256:43025b934ab61cbb6792f397334d4ba6024325b4face53f69644b4688ff8e0db
    restart: unless-stopped
    ports:
      # Poarta de autentificare - singurul port atins de tunel.
      - "0.0.0.0:4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_DOMAINS: ${DOMAIN}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      # OBLIGATORIU in spatele Cloudflare: fara el, oauth2-proxy ignora
      # X-Forwarded-Proto, construieste callback-ul pe http:// si login-ul
      # intra in bucla de redirect.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      # OBLIGATORIU alaturi de REVERSE_PROXY. Fara el, oauth2-proxy pastreaza
      # compatibilitatea si are incredere in `X-Forwarded-*` de la ORICE sursa
      # (0.0.0.0/0), cu doar un avertisment la pornire. Cum lista de rute publice se
      # potriveste pe PATH, un `X-Forwarded-Uri` venit de la client poate face o ruta
      # protejata sa treaca drept publica - adica ocolirea autentificarii. Ingress-ul
      # sterge oricum antetul; asta e al doilea strat.
      OAUTH2_PROXY_TRUSTED_PROXY_IPS: ${OAUTH2_PROXY_TRUSTED_PROXY_IPS:-172.16.0.0/12}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://backend:3002/
      # Default-ul e 30s (ResponseHeaderTimeout pe transportul catre upstream).
      # POST /api/rnpm/search e sincron si nu emite headere pana nu termina, iar
      # rezolvarea captcha depaseste ocazional 30s (masurat: 2.5s ... >30s). La
      # depasire oauth2-proxy raspunde cu pagina lui de 502, cererea e abortata
      # (backend: 499) si captcha deja platita se pierde. Valoarea sta deliberat
      # sub plafonul Cloudflare (~100s, eroare 524), ca sa nu avem doua limite
      # care se declanseaza simultan cu coduri de eroare diferite.
      OAUTH2_PROXY_UPSTREAM_TIMEOUT: 90s
      OAUTH2_PROXY_REDIRECT_URL: https://${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS}
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # /delogat e pagina de aterizare dupa sign_out. Trebuie sa fie publica:
      # gate-uita, ar re-declansa login-ul Google si utilizatorul s-ar intoarce
      # logat, fara sa inteleaga de ce.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "GET=^/health$$,GET=^/api/v1/auth/oauth2/sync$$,GET=^/delogat$$"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "true"
      OAUTH2_PROXY_BASIC_AUTH_PASSWORD: ${PROXY_BRIDGE_SECRET}
    depends_on:
      - backend
    networks:
      - ld_net

  # Ingress dedicat pentru API-ul programatic (Personal Access Tokens). Ruleaza pe
  # un hostname SEPARAT in tunel; hostname-ul de browser ramane integral in spatele
  # oauth2-proxy. Vezi deploy/Caddyfile.pat pentru matcher + strip list.
  caddy-pat:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      # A doua poarta atinsa de tunel — accepta DOAR cereri cu Bearer ld_pat_*.
      - "0.0.0.0:4181:4181"
    volumes:
      - ./deploy/Caddyfile.pat:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
    networks:
      - ld_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    # v2.45.0: fara default. Unul tacut ramanea in urma la fiecare release si
    # eticheta imaginea noua cu o versiune veche, deci tag-ul mintea la rollback.
    image: legal-dashboard:${APP_VERSION:?seteaza APP_VERSION in .env}
    restart: unless-stopped
    expose:
      # IMPORTANT: NU inlocui cu `ports:` — backend-ul trebuie sa ramana
      # accesibil doar din reteaua interna, prin oauth2-proxy. Publicat direct,
      # ar fi accesibil din LAN fara autentificare Google.
      - "3002"
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      LEGAL_DASHBOARD_PORT: 3002
      LEGAL_DASHBOARD_AUTH_MODE: web
      LEGAL_DASHBOARD_ALLOW_REMOTE: "1"
      LEGAL_DASHBOARD_JWT_SECRET: ${JWT_SECRET}
      LEGAL_DASHBOARD_JWT_ISSUER: ${JWT_ISSUER:-legal-dashboard-nas}
      LEGAL_DASHBOARD_JWT_AUDIENCE: ${JWT_AUDIENCE:-legal-dashboard-nas}
      LEGAL_DASHBOARD_JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      LEGAL_DASHBOARD_OAUTH2_PROXY_SECRET: ${PROXY_BRIDGE_SECRET}
      LEGAL_DASHBOARD_TRUSTED_PROXY_CIDR: ${LEGAL_DASHBOARD_TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      TENANT_KEY_ENCRYPTION_SECRET: ${TENANT_KEY_SECRET}
      LEGAL_DASHBOARD_DB_PATH: /data/legal-dashboard.db
      MONITORING_DISABLED_KINDS: ${MONITORING_DISABLED_KINDS:-}
      RNPM_RUNTIME_VALIDATION_DISABLED: ${RNPM_RUNTIME_VALIDATION_DISABLED:-}
      RNPM_TIMEOUT_MS: ${RNPM_TIMEOUT_MS:-}
      RNPM_RECOVERY_BUDGET_MS: ${RNPM_RECOVERY_BUDGET_MS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
    volumes:
      # bind mount, nu volum numit: fisierul e vizibil in File Station si intra
      # in Hyper Backup impreuna cu restul folderului
      - ./data:/data
    networks:
      - ld_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

networks:
  ld_net:
    driver: bridge

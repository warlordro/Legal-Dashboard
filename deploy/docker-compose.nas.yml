# Legal Dashboard — deploy pe NAS Synology, in spatele unui Cloudflare Tunnel.
#
# Layout:
#   internet → Cloudflare (TLS, WAF, DDoS) → cloudflared (container separat)
#     → oauth2-proxy (4180, publicat pe host) → backend (3002, expose only)
#
# Diferente fata de deploy/docker-compose.prod.yml:
#   - fara Caddy: TLS-ul e terminat de Cloudflare, iar tunelul e outbound-only,
#     deci nu se deschid porturile 80/443 in router si nu exista Let's Encrypt;
#   - oauth2-proxy publica portul 4180 pe host, pentru ca tunelul ruleaza in alt
#     proiect Container Manager (alta retea Docker) si il atinge prin IP-ul LAN;
#   - baza SQLite sta pe bind mount ./data, ca sa intre in Hyper Backup.
#
# ATENTIE: acest fisier se COPIAZA in radacina proiectului, redenumit
# docker-compose.yml (`context: .` presupune ca sta langa Dockerfile). Rulat
# din deploy/, contextul de build ar fi gresit.
#
# Start (Container Manager: Project → Create, path = radacina proiectului,
# source = Use existing docker-compose.yml) sau din CLI:
#   docker compose --env-file .env up -d
services:
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1-alpine@sha256:1a2009d3b05316a5f0a482d8951422cdf100c31fb661fd48f2b4687c87c4ffa1
    restart: unless-stopped
    ports:
      # Poarta de autentificare - singurul port atins de tunel.
      - "0.0.0.0:4180:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: google
      OAUTH2_PROXY_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_DOMAINS: ${DOMAIN}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 168h
      # OBLIGATORIU in spatele Cloudflare: fara el, oauth2-proxy ignora
      # X-Forwarded-Proto, construieste callback-ul pe http:// si login-ul
      # intra in bucla de redirect.
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://backend:3002/
      OAUTH2_PROXY_REDIRECT_URL: https://${DOMAIN}/oauth2/callback
      OAUTH2_PROXY_WHITELIST_DOMAINS: .${DOMAIN}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${OAUTH2_PROXY_EMAIL_DOMAINS}
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # /delogat e pagina de aterizare dupa sign_out. Trebuie sa fie publica:
      # gate-uita, ar re-declansa login-ul Google si utilizatorul s-ar intoarce
      # logat, fara sa inteleaga de ce.
      OAUTH2_PROXY_SKIP_AUTH_ROUTES: "GET=^/health$$,GET=^/api/v1/auth/oauth2/sync$$,GET=^/delogat$$"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "true"
      OAUTH2_PROXY_BASIC_AUTH_PASSWORD: ${PROXY_BRIDGE_SECRET}
    depends_on:
      - backend
    networks:
      - ld_net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: legal-dashboard:${APP_VERSION:-2.43.3}
    restart: unless-stopped
    expose:
      # IMPORTANT: NU inlocui cu `ports:` — backend-ul trebuie sa ramana
      # accesibil doar din reteaua interna, prin oauth2-proxy. Publicat direct,
      # ar fi accesibil din LAN fara autentificare Google.
      - "3002"
    environment:
      HOST: 0.0.0.0
      NODE_ENV: production
      LEGAL_DASHBOARD_PORT: 3002
      LEGAL_DASHBOARD_AUTH_MODE: web
      LEGAL_DASHBOARD_ALLOW_REMOTE: "1"
      LEGAL_DASHBOARD_JWT_SECRET: ${JWT_SECRET}
      LEGAL_DASHBOARD_JWT_ISSUER: ${JWT_ISSUER:-legal-dashboard-nas}
      LEGAL_DASHBOARD_JWT_AUDIENCE: ${JWT_AUDIENCE:-legal-dashboard-nas}
      LEGAL_DASHBOARD_JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-3600}
      LEGAL_DASHBOARD_OAUTH2_PROXY_SECRET: ${PROXY_BRIDGE_SECRET}
      LEGAL_DASHBOARD_TRUSTED_PROXY_CIDR: ${LEGAL_DASHBOARD_TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      TENANT_KEY_ENCRYPTION_SECRET: ${TENANT_KEY_SECRET}
      LEGAL_DASHBOARD_DB_PATH: /data/legal-dashboard.db
      MONITORING_DISABLED_KINDS: ${MONITORING_DISABLED_KINDS:-}
      RNPM_RUNTIME_VALIDATION_DISABLED: ${RNPM_RUNTIME_VALIDATION_DISABLED:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
    volumes:
      # bind mount, nu volum numit: fisierul e vizibil in File Station si intra
      # in Hyper Backup impreuna cu restul folderului
      - ./data:/data
    networks:
      - ld_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

networks:
  ld_net:
    driver: bridge
